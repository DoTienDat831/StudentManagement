<body>
    <div class="container">
        <h1>Student management</h1>

    <form class="student-form">

        <input name="enrollment_time" placeholder="Enrollment time">
        <input name="major" placeholder="Major">
        <button class="add-btn">Add student</button>

    <input class="search-by-id" placeholder="Search by id">

    <table class="student-table">
        <thead><tr><th>StudentId</th><th>Name</th><th>Birth</th><th>Enro</th><th>Major</th></tr></thead>
        <tbody>

        </tbody>
    </table>
